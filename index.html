<!DOCTYPE html>
<html lang="vi" >
<head>
  <meta charset="UTF-8">
  <title>HAV</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="container"></div>
<div id="info">Bảng Tuần Hoàn Hóa Học 3D ·</div>
<div id="menu">
<button id="table">Bảng</button>
<button id="sphere">Cầu</button>
<button id="helix">Xoắn ốc</button>
<button id="grid">Lưới</button>
</div>
<div id="popup">
  <div id="popup-card">
    <button id="popup-close">×</button>
    <div id="popup-head">
      <div id="popup-number">1</div>
      <div id="popup-category-badge">Phi kim</div>
    </div>
    <div id="popup-symbol">H</div>
    <div id="popup-name">Hydro</div>
    <div id="popup-latin">Hydrogen</div>
    <div id="popup-grid">
      <div class="popup-cell">
        <div class="popup-cell-label">Khối lượng</div>
        <div class="popup-cell-value" id="popup-mass">1.008</div>
      </div>
      <div class="popup-cell">
        <div class="popup-cell-label">Nhóm</div>
        <div class="popup-cell-value" id="popup-group">IA</div>
      </div>
      <div class="popup-cell">
        <div class="popup-cell-label">Chu kỳ</div>
        <div class="popup-cell-value" id="popup-period">1</div>
      </div>
      <div class="popup-cell">
        <div class="popup-cell-label">Phân loại</div>
        <div class="popup-cell-value" id="popup-type">Phi kim</div>
      </div>
    </div>
  </div>
</div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r67/three.min.js'></script><script  src="./script.js"></script>
</body>
</html>
